[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-gcl-paper-model"
version = "1.0.0"
description = "Standalone implementation of the formal LLM-GCL model reported in the paper"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.1.3",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "xgboost==3.1.3",
  "catboost==1.2.10",
  "joblib==1.4.2",
]

[project.scripts]
llm-gcl = "llm_gcl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
